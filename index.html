<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footy News Aggregator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    h1 { text-align: center; }
    .news-card {
      margin: 15px auto;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      max-width: 600px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .news-card h3 { margin: 0 0 10px; }
    .news-card p { color: #555; }
    .error { color: red; text-align: center; }
  </style>
</head>
<body>
  <h1>⚽ Premier League News</h1>
  <div id="news-container">Loading news...</div>

  <script>
    async function fetchNews() {
      const container = document.getElementById('news-container');
      try {
        const response = await fetch('/api/news');
        const data = await response.json();

        if (!data.articles || data.articles.length === 0) {
          container.innerHTML = '<p class="error">No Premier League news available.</p>';
          return;
        }

        container.innerHTML = data.articles.map(article => `
          <div class="news-card">
            <h3>${article.title}</h3>
            <p>${article.description || 'No description available'}</p>
            <a href="${article.url}" target="_blank">Read more</a>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="error">Error loading news.</p>';
      }
    }

    fetchNews();
  </script>
</body>
</html>
